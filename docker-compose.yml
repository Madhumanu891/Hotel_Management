version: '3.8'

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: hotel_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hotel_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ── Microservices ───────────────────────────────────────────────────────────

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: hotel_api_gateway
    ports:
      - "3000:3000"
    env_file: ./api-gateway/.env
    environment:
      - AUTH_SERVICE_URL=http://auth-service:3001
      - PROPERTY_SERVICE_URL=http://property-service:3002
      - BOOKING_SERVICE_URL=http://booking-service:3003
      - PAYMENT_SERVICE_URL=http://payment-service:3004
      - HOUSEKEEPING_SERVICE_URL=http://housekeeping-service:3005
      - NOTIFICATION_SERVICE_URL=http://notification-service:3006
      - RESTAURANT_SERVICE_URL=http://restaurant-service:3007
      - STAFF_SERVICE_URL=http://staff-service:3008
      - ANALYTICS_SERVICE_URL=http://analytics-service:3009
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: hotel_auth_service
    ports:
      - "3001:3001"
    env_file: ./auth-service/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  property-service:
    build:
      context: .
      dockerfile: property-service/Dockerfile
    container_name: hotel_property_service
    ports:
      - "3002:3002"
    env_file: ./property-service/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    container_name: hotel_booking_service
    ports:
      - "3003:3003"
    env_file: ./booking-service/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672
      - PROPERTY_SERVICE_URL=http://property-service:3002
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: hotel_payment_service
    ports:
      - "3004:3004"
    env_file: ./payment-service/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672
      - BOOKING_SERVICE_URL=http://booking-service:3003
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  housekeeping-service:
    build:
      context: .
      dockerfile: housekeeping-service/Dockerfile
    container_name: hotel_housekeeping_service
    ports:
      - "3005:3005"
    env_file: ./housekeeping-service/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: hotel_notification_service
    ports:
      - "3006:3006"
    env_file: ./notification-service/.env
    environment:
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  restaurant-service:
    build:
      context: .
      dockerfile: restaurant-service/Dockerfile
    container_name: hotel_restaurant_service
    ports:
      - "3007:3007"
    env_file: ./restaurant-service/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  staff-service:
    build:
      context: .
      dockerfile: staff-service/Dockerfile
    container_name: hotel_staff_service
    ports:
      - "3008:3008"
    env_file: ./staff-service/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    container_name: hotel_analytics_service
    ports:
      - "3009:3009"
    env_file: ./analytics-service/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - BOOKING_SERVICE_URL=http://booking-service:3003
      - PROPERTY_SERVICE_URL=http://property-service:3002
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  rabbitmq_data:

networks:
  default:
    name: hotel_network